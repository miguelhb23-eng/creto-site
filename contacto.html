    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Contacta a CRETO en Manizales. Escríbenos por WhatsApp o déjanos tus datos y te respondemos rápido con un presupuesto claro."
    />
    <link rel="canonical" href="https://cretoingenieria.com/contacto.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRETO Ingeniería y Construcciones" />
    <meta property="og:title" content="Contacto · CRETO Ingeniería y Construcciones" />
    <meta
      property="og:description"
      content="Contacta a CRETO en Manizales. Escríbenos por WhatsApp o déjanos tus datos y te respondemos rápido con un presupuesto claro."
    />
    <meta property="og:url" content="https://cretoingenieria.com/contacto.html" />
    <meta property="og:image" content="https://cretoingenieria.com/og-image.jpg" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contacto · CRETO Ingeniería y Construcciones" />
    <meta
      name="twitter:description"
      content="Contacta a CRETO en Manizales. Escríbenos por WhatsApp o déjanos tus datos y te respondemos rápido con un presupuesto claro."
    />
    <meta name="twitter:image" content="https://cretoingenieria.com/og-image.jpg" />
  </head>
  <body class="page-contacto">
    <header id="site-header" class="site-header"><!--ssr:header--></header>
    <main>
      <section class="section" style="padding-top: calc(var(--header-h) + clamp(3rem, 8vw, 6rem))" aria-labelledby="hero-titulo">
        <div class="container contacto">
          <div data-reveal>
            <h1 id="hero-titulo" class="h1">Cuéntanos tu proyecto</h1>
            <p class="lead" style="margin-top: 1.75rem">
              El primer paso es una conversación. Escríbenos por WhatsApp para una respuesta inmediata, o déjanos tus
              datos y nosotros te contactamos.
            </p>
            <div class="canales" id="contacto-canales"><!--ssr:canales--></div>
          </div>

          <!-- Formulario vía Web3Forms (gratis, sin backend). La clave sale de src/data/site.ts (web3formsKey). -->
          <form action="https://api.web3forms.com/submit" method="POST" class="form" id="form" data-reveal style="--d: 120ms">
            <div id="form-aviso"></div>
            <h2 class="form__titulo">Déjanos tus datos</h2>
            <p class="form__intro">Solo lo esencial para poder contactarte. Sin compromiso.</p>

            <input type="hidden" name="access_key" id="w3f-key" value="<!--ssr:w3f-key-->" />
            <input type="hidden" name="subject" value="Nuevo contacto desde la web de CRETO" />
            <input type="hidden" name="from_name" value="Web CRETO" />
            <input type="hidden" name="redirect" value="https://cretoingenieria.com/contacto.html?enviado=1" />
            <input type="checkbox" name="botcheck" style="display: none" tabindex="-1" autocomplete="off" />

            <div class="form__grid">
              <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" autocomplete="name" required />
              </div>
              <div class="field">
                <label for="telefono">WhatsApp o teléfono</label>
                <input id="telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="300 123 4567" required />
              </div>
              <div class="field">
                <label for="perfil">Soy</label>
                <select id="perfil" name="perfil">
                  <option>Persona o familia</option>
                  <option>Empresa o entidad</option>
                  <option>Constructora que busca un aliado</option>
                </select>
              </div>
              <div class="field">
                <label for="tipo">Tipo de proyecto</label>
                <select id="tipo" name="tipo">
                  <option>Remodelación</option>
                  <option>Construcción u obra nueva</option>
                  <option>Diseño o ingeniería</option>
                  <option>Mantenimiento (Express)</option>
                  <option>Otro</option>
                </select>
              </div>
              <div class="field field--full">
                <label for="mensaje">Cuéntanos brevemente <span>(opcional)</span></label>
                <textarea id="mensaje" name="mensaje" rows="4"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn--red btn--lg form__enviar" id="form-btn">Enviar solicitud</button>
            <p class="form__nota">Te contactamos por WhatsApp o llamada en horario laboral.</p>
          </form>
        </div>
      </section>
    </main>
    <footer id="site-footer" class="site-footer"><!--ssr:footer--></footer>
    <!--ssr:chat-->
    <script type="module" src="/src/pages/contacto.ts"></script>
  </body>
</html>
